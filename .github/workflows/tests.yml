name: Revaliv tests

on:
  push:
    branches:
      - revaliv-current-review
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: revaliv-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVALIV_DATABASE_URI: sqlite://
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
