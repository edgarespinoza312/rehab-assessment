name: Revaliv tests

on:
  push:
    branches:
      - 'revaliv-*'
  pull_request:
    branches:
      - main
      - revaliv-current-review

permissions:
  contents: read

concurrency:
  group: revaliv-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      REVALIV_DATABASE_URI: sqlite://
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Smoke-test full database migrations
        env:
          REVALIV_DATABASE_URI: sqlite:////tmp/revaliv-migration-smoke.sqlite
        run: |
          rm -f /tmp/revaliv-migration-smoke.sqlite
          python - <<'PY'
          from sqlalchemy import inspect
          from dashboard.app import app
          from dashboard.database import db

          expected_tables = {
              "patients",
              "assessment_records",
              "users",
              "roles",
              "user_roles",
              "workout_plans",
              "workout_plan_exercises",
              "workout_sessions",
              "workout_exercise_results",
              "progression_review_events",
              "patient_assignments",
          }

          with app.app_context():
              actual_tables = set(inspect(db.engine).get_table_names())
              missing_tables = sorted(expected_tables - actual_tables)
              if missing_tables:
                  raise SystemExit(
                      "Migration smoke test is missing tables: "
                      + ", ".join(missing_tables)
                  )
              print("Alembic upgrade created all required tables.")
          PY
      - name: Run tests
        run: python -m pytest -q
